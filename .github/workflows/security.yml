name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency Audit and Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and scanner
        run: |
          python -m pip install -r requirements-dev.txt pip-audit

      - name: Audit runtime dependencies
        run: |
          python -m pip_audit --strict -r requirements.txt

      - name: Run test suite
        env:
          JWT_SECRET_KEY: ci-only-test-secret-not-for-production
        run: |
          python -m pytest -q
