name: Security Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Dependency Audit, Migrations and Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexawork_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nexawork_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies and scanner
        run: |
          python -m pip install -r requirements-dev.txt pip-audit

      - name: Audit runtime dependencies
        run: |
          python -m pip_audit --strict -r requirements.txt

      - name: Verify PostgreSQL migrations
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: nexawork_migration_test
          DB_USER: postgres
          DB_PASSWORD: ci-postgres-password
          JWT_SECRET_KEY: ci-only-test-secret-not-for-production
        run: |
          python -m alembic upgrade head
          python -m alembic upgrade head

          revision="$(python -m alembic current)"
          printf 'Current database revision: %s\n' "$revision"
          grep -q '3f7330e74933' <<< "$revision"

      - name: Run test suite
        env:
          JWT_SECRET_KEY: ci-only-test-secret-not-for-production
        run: |
          python -m pytest -q
